name: job-hunter

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Только loopback — в локальной сети база не видна. Публикация нужна для
      # e2e-тестов и TypeORM CLI, которые запускаются с хоста, а не внутри compose-сети.
      - '127.0.0.1:${DATABASE_PORT_HOST:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-log}
      API_PORT: 3000
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AUTH_USER: ${AUTH_USER}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      HH_SITE_BASE_URL: ${HH_SITE_BASE_URL:-https://hh.ru}
      HH_USER_AGENT: ${HH_USER_AGENT}
      HH_REQUEST_TIMEOUT_MS: ${HH_REQUEST_TIMEOUT_MS:-10000}
      HH_MAX_RETRIES: ${HH_MAX_RETRIES:-2}
      GETMATCH_SITE_BASE_URL: ${GETMATCH_SITE_BASE_URL:-https://getmatch.ru}
      GETMATCH_USER_AGENT: ${GETMATCH_USER_AGENT:-job-hunter/1.0}
      GETMATCH_REQUEST_TIMEOUT_MS: ${GETMATCH_REQUEST_TIMEOUT_MS:-10000}
      GETMATCH_MAX_RETRIES: ${GETMATCH_MAX_RETRIES:-2}
      IT_VACANCIES_SITE_BASE_URL: ${IT_VACANCIES_SITE_BASE_URL:-https://it-vacancies.ru}
      IT_VACANCIES_USER_AGENT: ${IT_VACANCIES_USER_AGENT:-job-hunter/1.0}
      IT_VACANCIES_REQUEST_TIMEOUT_MS: ${IT_VACANCIES_REQUEST_TIMEOUT_MS:-10000}
      IT_VACANCIES_MAX_RETRIES: ${IT_VACANCIES_MAX_RETRIES:-2}
      IT_VACANCIES_MAX_REQUESTS_PER_SECOND: ${IT_VACANCIES_MAX_REQUESTS_PER_SECOND:-2}
      SYNC_CONCURRENCY: ${SYNC_CONCURRENCY:-3}
      SYNC_MIN_DELAY_MS: ${SYNC_MIN_DELAY_MS:-200}
      SCHEDULED_SYNC_ENABLED: ${SCHEDULED_SYNC_ENABLED:-true}
      SCHEDULED_SYNC_INTERVAL_MS: ${SCHEDULED_SYNC_INTERVAL_MS:-1800000}
      # §4.10: каталог логотипов лежит на именованном томе logos (см. volumes ниже),
      # а не в /tmp: /tmp пересоздаётся вместе с контейнером, и после каждого релиза
      # шапки всех записей показывали букву-фолбэк, пока запись не синхронизируют заново
      # (у закрытых записей — никогда, их не трогает ни «Обновить все открытые», ни §4.7).
      COMPANY_LOGO_DIR: ${COMPANY_LOGO_DIR:-/var/lib/job-hunter/logos}
      COMPANY_LOGO_REQUEST_TIMEOUT_MS: ${COMPANY_LOGO_REQUEST_TIMEOUT_MS:-5000}
      # --- Поиск, отбор и отображение вакансий с hh.ru (§4.11, §4.12) ---
      HH_MAX_REQUESTS_PER_SECOND: ${HH_MAX_REQUESTS_PER_SECOND:-2}
      VACANCY_SCAN_MAX_PAGES: ${VACANCY_SCAN_MAX_PAGES:-40}
      VACANCY_SCAN_MAX_DETAILS: ${VACANCY_SCAN_MAX_DETAILS:-600}
      VACANCY_SCAN_MAX_AGE_DAYS: ${VACANCY_SCAN_MAX_AGE_DAYS:-30}
      VACANCY_SCAN_MAX_DURATION_MS: ${VACANCY_SCAN_MAX_DURATION_MS:-14400000}
      VACANCY_PREFILTER_MODE: ${VACANCY_PREFILTER_MODE:-exclude_only}
      VACANCY_MATCH_MODE: ${VACANCY_MATCH_MODE:-any}
      VACANCY_LEADS_LIST_LIMIT: ${VACANCY_LEADS_LIST_LIMIT:-500}
      VACANCY_AI_PROVIDER: ${VACANCY_AI_PROVIDER:-ollama}
      VACANCY_AI_BASE_URL: ${VACANCY_AI_BASE_URL:-http://ollama:11434}
      VACANCY_AI_MODEL: ${VACANCY_AI_MODEL:-qwen3:4b-instruct}
      VACANCY_AI_API_KEY: ${VACANCY_AI_API_KEY:-}
      VACANCY_AI_BATCH_SIZE: ${VACANCY_AI_BATCH_SIZE:-10}
      VACANCY_AI_TIMEOUT_MS: ${VACANCY_AI_TIMEOUT_MS:-120000}
      VACANCY_AI_DESCRIPTION_MAX_CHARS: ${VACANCY_AI_DESCRIPTION_MAX_CHARS:-6000}
    volumes:
      # Путь совпадает с дефолтом COMPANY_LOGO_DIR выше; каталог создан в образе
      # с владельцем node, поэтому свежий том достаётся процессу доступным на запись.
      - logos:/var/lib/job-hunter/logos
    # Порт наружу не публикуется: снаружи доступен только web.
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:3000/api/health | grep -q ''"db":"up"''']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Только localhost — приложение не должно быть видно в локальной сети.
      - '127.0.0.1:${WEB_PORT:-8080}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  # §4.12.4: ИИ-отбор вакансий опционален — без флага `--profile ai` сервис не
  # поднимается, а инфраструктура без ИИ остаётся прежней. Модель качается вручную
  # (`docker compose exec ollama ollama pull qwen3:4b-instruct`) — автоскачивание
  # при старте означало бы несколько гигабайт трафика по неявной команде.
  ollama:
    image: ollama/ollama
    restart: unless-stopped
    profiles: [ai]
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # Выгружает модель из RAM через 5 минут простоя — прогон запускается только
      # вручную (§4.11.10), большую часть времени модель не нужна.
      OLLAMA_KEEP_ALIVE: 5m
    ports:
      # Только loopback, как у db: внутри compose-сети api ходит по имени ollama,
      # а публикация нужна дев-режиму (`npm run dev:api` работает на хосте и имя
      # ollama не резолвит) и ручной диагностике curl'ом.
      - '127.0.0.1:${OLLAMA_PORT_HOST:-11434}:11434'
    # Проброс GPU: без него ollama считает на CPU и одна вакансия занимает секунды
    # вместо десятых долей. На машине без NVIDIA-драйвера в Docker эту секцию надо
    # убрать — иначе контейнер не стартует; на CPU сервис работает без других правок.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pgdata:
  logos:
  ollama-models:
