name: job-hunter

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Только loopback — в локальной сети база не видна. Публикация нужна для
      # e2e-тестов и TypeORM CLI, которые запускаются с хоста, а не внутри compose-сети.
      - '127.0.0.1:${DATABASE_PORT_HOST:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-log}
      API_PORT: 3000
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AUTH_USER: ${AUTH_USER}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      HH_SITE_BASE_URL: ${HH_SITE_BASE_URL:-https://hh.ru}
      HH_USER_AGENT: ${HH_USER_AGENT}
      HH_REQUEST_TIMEOUT_MS: ${HH_REQUEST_TIMEOUT_MS:-10000}
      HH_MAX_RETRIES: ${HH_MAX_RETRIES:-2}
      GETMATCH_SITE_BASE_URL: ${GETMATCH_SITE_BASE_URL:-https://getmatch.ru}
      GETMATCH_USER_AGENT: ${GETMATCH_USER_AGENT:-job-hunter/1.0}
      GETMATCH_REQUEST_TIMEOUT_MS: ${GETMATCH_REQUEST_TIMEOUT_MS:-10000}
      GETMATCH_MAX_RETRIES: ${GETMATCH_MAX_RETRIES:-2}
      SYNC_CONCURRENCY: ${SYNC_CONCURRENCY:-3}
      SYNC_MIN_DELAY_MS: ${SYNC_MIN_DELAY_MS:-200}
    # Порт наружу не публикуется: снаружи доступен только web.
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:3000/api/health | grep -q ''"db":"up"''']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Только localhost — приложение не должно быть видно в локальной сети.
      - '127.0.0.1:${WEB_PORT:-8080}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
