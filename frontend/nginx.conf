server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Приложение личное и локальное — индексировать нечему, но пусть будет.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA: любой неизвестный путь отдаём index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Хешированные ассеты Vite можно кэшировать навсегда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html кэшировать нельзя — иначе после пересборки отдаётся старый бандл.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Заголовок Authorization должен доходить до бэкенда без изменений:
        # именно им браузер отдаёт Basic Auth.
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
    }
}
